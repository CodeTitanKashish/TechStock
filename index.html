<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockSense – Enterprise Inventory Management System</title>
    <meta name="description" content="Complete web-based ERP inventory management platform with multi-warehouse tracking, stock movements, receipts, deliveries, internal transfers, approvals, and real-time ledger." />
    <meta property="og:title" content="StockSense – Enterprise Inventory Management System" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme') || localStorage.getItem('stocksense_theme_v2');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
